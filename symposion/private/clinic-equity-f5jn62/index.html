.msg.error { color: var(--alert); }
.foot { margin: 18px 0 0; font-size: 13px; color: var(--muted); }
.host { margin: 18px 2px 0; font: 13px/1.5 var(--body); color: var(--muted); letter-spacing: 0.18em; }

<script>(function () {
  var form = document.getElementById('unlock');
  var field = document.getElementById('pass');
  var button = document.getElementById('go');
  var msg = document.getElementById('msg');
  var payload = JSON.parse(document.getElementById('payload').textContent);
  function say(text, isError) { msg.textContent = text; msg.className = isError ? 'msg error' : 'msg'; }
  function bytes(b64) { var s = atob(b64); var out = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }
  if (!window.crypto || !window.crypto.subtle) {
    say('This browser cannot unlock the page here. Open the link you were sent (it starts with https) in Safari, Chrome, Edge or Firefox.', true);
    button.disabled = true;
    return;
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = field.value.trim().normalize('NFC');
    if (!pass) { say('Enter the password.', true); field.focus(); return; }
    button.disabled = true;
    say('Unlocking…', false);
    var subtle = window.crypto.subtle;
    subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iterations },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data)); })
      .then(function (plain) {
        var html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      }, function () {
        button.disabled = false;
        say('That password is not right. Check it and try again.', true);
        field.select();
      });
  });
})();</script>
